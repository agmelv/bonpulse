app = "pulsebon"
primary_region = "iad"

[env]
HOST = "0.0.0.0"
PORT = "3000"

[[services]]
auto_start_machines = true
auto_stop_machines = true
internal_port = 3000
protocol = "tcp"

  [[services.ports]]
  handlers = [ "http" ]
  port = 80

  [[services.ports]]
  handlers = [ "tls", "http" ]
  port = 443
